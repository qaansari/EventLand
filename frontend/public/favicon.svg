<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1a"/>
      <stop offset="50%" stop-color="#0c1736"/>
      <stop offset="100%" stop-color="#050a18"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="lightBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box with Soft Rounded Corners -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="rgba(59, 130, 246, 0.25)" stroke-width="6"/>

  <!-- Main "EL" Logo Graphic -->
  <g filter="url(#glow)">
    <!-- Letter E -->
    <path d="M 120 140 H 250 V 185 H 175 V 230 H 240 V 275 H 175 V 325 H 250 V 370 H 120 Z" fill="url(#blueGrad)" />
    <!-- Ticket notches on Left of E -->
    <path d="M 120 195 A 15 15 0 0 0 120 225 Z" fill="#070c1a" />
    <path d="M 120 285 A 15 15 0 0 0 120 315 Z" fill="#070c1a" />

    <!-- Letter L -->
    <path d="M 270 140 H 315 V 325 H 390 V 370 H 270 Z" fill="url(#blueGrad)" />

    <!-- Location Pin embedded at bottom left of L -->
    <g transform="translate(262, 305)">
      <path d="M 30 0 C 13.4 0 0 13.4 0 30 C 0 52.5 30 75 30 75 C 30 75 60 52.5 60 30 C 60 13.4 46.6 0 30 0 Z" fill="url(#lightBlueGrad)" />
      <circle cx="30" cy="28" r="11" fill="#070c1a" />
    </g>

    <!-- Sparkle / Star Icon near top right of L -->
    <path d="M 360 130 Q 360 100 375 100 Q 360 100 360 70 Q 360 100 345 100 Q 360 100 360 130 Z" fill="#e0f2fe" />
  </g>
</svg>