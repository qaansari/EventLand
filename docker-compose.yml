services:
  api:
    build:
      context: ./backend/src
      dockerfile: EventLand.Api/Dockerfile
    ports:
      - "7257:7257"
      - "4257:4257"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mssql;Database=EventLandDb;User Id=sa;Password=${SA_PASSWORD:-YourStrong!Passw0rd};MultipleActiveResultSets=true;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__SecretKey: "${JWT_SECRET:-DEV_ONLY_EventLand_SecretKey_ChangeMe!_0123456789abcdef}"
      Jwt__Issuer: EventLandApi
      Jwt__Audience: EventLandClients
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: https://localhost:5173
      Cors__AllowedOrigins__2: http://localhost:5174
      Cors__AllowedOrigins__3: https://localhost:5174
      Cors__AllowedOrigins__4: http://localhost:4173
      Cors__AllowedOrigins__5: https://localhost:4173
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_started

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD:-YourStrong!Passw0rd}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P '${SA_PASSWORD:-YourStrong!Passw0rd}' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mssql-data:
  redis-data:
